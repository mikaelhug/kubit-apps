apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-conf
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / {
        auth_basic "notes";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        root /usr/share/nginx/html;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-html
data:
  index.html: |
    <h1>Carol's private notes</h1>
