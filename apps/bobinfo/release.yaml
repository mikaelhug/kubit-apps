apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bobinfo
spec:
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: podinfo
  values:
    replicaCount: 1
    ui:
      message: Bob fixed his tag
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: selfsigned
      hosts:
        - host: bobinfo.192.168.105.200.nip.io
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: bobinfo-tls
          hosts:
            - bobinfo.192.168.105.200.nip.io
