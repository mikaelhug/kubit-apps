apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-bot
  labels:
    app.kubernetes.io/name: eve-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: python:3.13-alpine
          command: ["python", "-u", "/app/bot.py"]
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eve-bot
                  key: BOT_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: bot-code
