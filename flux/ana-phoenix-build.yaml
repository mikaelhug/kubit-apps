apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ana-phoenix-build
  namespace: flux-system
spec:
  path: ./apps/ana-phoenix/build
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  prune: true
  wait: true
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
