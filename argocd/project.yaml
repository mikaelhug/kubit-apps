apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Applications from apps/, one namespace each
  sourceRepos:
    - https://github.com/mikaelhug/kubit-apps.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "!kube-*"
    - server: https://kubernetes.default.svc
      namespace: "!argocd"
    - server: https://kubernetes.default.svc
      namespace: "!cert-manager"
    - server: https://kubernetes.default.svc
      namespace: "!ingress-nginx"
    - server: https://kubernetes.default.svc
      namespace: "!longhorn-system"
    - server: https://kubernetes.default.svc
      namespace: "!metallb-system"
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
